<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1D2144">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MRFL">
<meta name="robots" content="noindex, nofollow">
<title>MRFL · My Transactions</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>">
<style>
  /* ============================================================
     THEME TOKENS — every color lives here, in BOTH themes.
     ============================================================ */
  :root {
    --bg:            #E9EDF9;
    --surface:       #FFFFFF;
    --surface-2:     #F1F4FC;
    --border:        #E2E6F4;

    --text:          #191D3A;
    --text-soft:     #4A5170;
    --text-muted:    #596080;

    --hero-bg:       #1D2144;
    --hero-text:     #FFFFFF;
    --hero-sub:      rgba(255,255,255,0.75);
    --hero-btn:      rgba(255,255,255,0.12);

    --primary:       #4A3FE0;
    --primary-strong:#3A31B8;
    --on-primary:    #FFFFFF;
    --primary-soft:  #ECEAFD;

    --amber:         #F6A723;
    --on-amber:      #241C05;
    --amber-soft:    #FDEFD3;
    --on-amber-soft: #7A5200;

    --danger:        #D92D33;
    --on-danger:     #FFFFFF;
    --danger-soft:   #FDE4E5;
    --on-danger-soft:#A11218;

    --success-soft:  #DDF3EA;
    --on-success-soft:#0B7A55;

    --neutral-soft:  #ECEFF7;
    --on-neutral-soft:#4A5170;

    --shadow:        0 8px 24px -8px rgba(25, 29, 58, 0.12);
    --shadow-sm:     0 2px 8px -2px rgba(25, 29, 58, 0.08);
    --radius:        20px;
    --radius-sm:     12px;
  }
  :root[data-theme="dark"] {
    --bg:            #0E1120;
    --surface:       #191D33;
    --surface-2:     #232849;
    --border:        #2A2F52;

    --text:          #EDEFFC;
    --text-soft:     #B7BCDB;
    --text-muted:    #9198BFF0;

    --hero-bg:       #232849;
    --hero-text:     #FFFFFF;
    --hero-sub:      rgba(255,255,255,0.72);
    --hero-btn:      rgba(255,255,255,0.10);

    --primary:       #A5A0FF;
    --primary-strong:#B9B4FF;
    --on-primary:    #FFFFFF;
    --primary-soft:  rgba(139,132,255,0.16);

    --amber:         #F6A723;
    --on-amber:      #241C05;
    --amber-soft:    rgba(246,167,35,0.16);
    --on-amber-soft: #FFCE7E;

    --danger:        #C82A30;
    --on-danger:     #FFFFFF;
    --danger-soft:   rgba(224,53,59,0.20);
    --on-danger-soft:#FF9DA0;

    --success-soft:  rgba(23,166,115,0.18);
    --on-success-soft:#4FD6A5;

    --neutral-soft:  #262B4C;
    --on-neutral-soft:#B7BCDB;

    --shadow:        0 8px 24px -8px rgba(0, 0, 0, 0.5);
    --shadow-sm:     0 2px 8px -2px rgba(0, 0, 0, 0.4);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    /* NOTE: no background/color transition here — transitioning var-derived
       backgrounds on html/body wedged mid-switch in Blink (bg stuck on the
       old theme). Theme changes apply instantly instead. */
  }
  .shell { max-width: 720px; margin: 0 auto; padding: 0 16px; }

  /* ============================================================
     HERO — dark rounded header card
     ============================================================ */
  header.hero {
    background: var(--hero-bg);
    color: var(--hero-text);
    padding: max(16px, env(safe-area-inset-top)) 0 42px;
    border-radius: 0 0 28px 28px;
  }
  .hero-top { display: flex; align-items: center; justify-content: flex-end; }
  .hero-actions { display: flex; gap: 8px; }
  .hero-actions button {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--hero-btn); border: none; color: var(--hero-text);
    font-size: 17px; cursor: pointer; line-height: 1;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .hero-actions button:active { background: rgba(255,255,255,0.25); }
  .hero-greet { margin-top: 10px; }
  .hero-greet h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.2px; }

  /* ============================================================
     STAT CHIPS
     ============================================================ */
  .stats {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
    margin: -26px 0 20px;
  }
  .stat {
    background: var(--surface); border-radius: var(--radius);
    padding: 14px 8px 12px; text-align: center; box-shadow: var(--shadow);
  }
  .stat .ic {
    width: 36px; height: 36px; border-radius: 50%; margin: 0 auto 8px;
    display: flex; align-items: center; justify-content: center; font-size: 17px;
  }
  .stat .ic.blue  { background: var(--primary-soft); }
  .stat .ic.amber { background: var(--amber-soft); }
  .stat .num { font-size: 21px; font-weight: 800; color: var(--text); line-height: 1.15; }
  .stat .lbl { font-size: 11px; color: var(--text-soft); margin-top: 2px; font-weight: 600; }

  /* ============================================================
     NEXT-DEADLINE COLOR-BLOCK CARD
     ============================================================ */
  a.next-banner {
    display: flex; align-items: center; gap: 12px;
    background: var(--amber); color: var(--on-amber);
    border-radius: var(--radius); padding: 16px 16px 16px 18px;
    margin: 0 0 22px; text-decoration: none; box-shadow: var(--shadow);
  }
  a.next-banner.red { background: var(--danger); color: var(--on-danger); }
  .nb-main { flex: 1; min-width: 0; }
  .nb-k {
    display: block; font-size: 10.5px; font-weight: 800; letter-spacing: 1px;
    text-transform: uppercase; opacity: 0.8; margin-bottom: 3px;
  }
  .nb-what { font-size: 17px; font-weight: 800; line-height: 1.3; display: block; }
  .nb-when { font-size: 13.5px; font-weight: 600; display: block; margin-top: 1px; }
  .nb-prop { display: block; font-size: 12.5px; margin-top: 5px; opacity: 0.85; font-weight: 600; }
  .nb-go {
    flex: none; width: 40px; height: 40px; border-radius: 50%;
    background: rgba(0,0,0,0.14); display: flex; align-items: center; justify-content: center;
    font-size: 17px; font-weight: 800;
  }
  a.next-banner.red .nb-go { background: rgba(255,255,255,0.2); }

  /* ============================================================
     SECTIONS + DEAL CARDS
     ============================================================ */
  .section-title {
    font-size: 15px; font-weight: 800; color: var(--text);
    margin: 22px 2px 12px; letter-spacing: -0.1px;
  }
  .deal {
    background: var(--surface); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 18px; margin-bottom: 16px;
  }
  .deal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .deal-addr { font-size: 16.5px; font-weight: 800; line-height: 1.35; color: var(--text); letter-spacing: -0.2px; }
  .pills { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .pill {
    display: inline-block; font-size: 11px; font-weight: 700; padding: 4px 10px;
    border-radius: 999px; white-space: nowrap;
  }
  .pill.side { background: var(--primary-soft); color: var(--primary-strong); }
  .pill.st-on_track, .pill.st-active { background: var(--success-soft); color: var(--on-success-soft); }
  .pill.st-warning  { background: var(--amber-soft); color: var(--on-amber-soft); }
  .pill.st-urgent, .pill.st-past_due { background: var(--danger-soft); color: var(--on-danger-soft); }
  .pill.st-closed   { background: var(--neutral-soft); color: var(--on-neutral-soft); }
  .pill.st-cancelled{ background: var(--danger-soft); color: var(--on-danger-soft); }
  .pill.st-on_hold  { background: var(--amber-soft); color: var(--on-amber-soft); }

  .daypill {
    flex: none; font-size: 11.5px; font-weight: 800; white-space: nowrap;
    background: var(--hero-bg); color: #FFFFFF;
    padding: 6px 11px; border-radius: 999px;
  }

  .progress { height: 8px; background: var(--surface-2); border-radius: 999px; margin: 14px 0 5px; overflow: hidden; }
  .progress > div { height: 100%; background: linear-gradient(90deg, #8B5CF6, #4A3FE0); border-radius: 999px; }
  :root[data-theme="dark"] .progress > div { background: linear-gradient(90deg, #9F7DFF, #7C74FF); }
  .progress-lbl { font-size: 11.5px; color: var(--text-muted); font-weight: 600; }

  .callout {
    display: flex; gap: 8px; align-items: flex-start;
    background: var(--amber-soft); color: var(--on-amber-soft);
    border-radius: var(--radius-sm);
    padding: 11px 13px; margin: 13px 0 4px; font-size: 13px; font-weight: 600;
  }
  .callout.red { background: var(--danger-soft); color: var(--on-danger-soft); }
  .callout b { font-weight: 800; }

  /* milestone list rows */
  .miles { margin-top: 13px; border-top: 1px solid var(--border); padding-top: 7px; }
  .mile { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .mile:last-child { border-bottom: none; }
  .mile .dot {
    width: 28px; height: 28px; border-radius: 50%; flex: none;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 800;
  }
  .mile.done .dot   { background: var(--success-soft); color: var(--on-success-soft); }
  .mile.late .dot   { background: var(--danger-soft); color: var(--on-danger-soft); }
  .mile.soon .dot   { background: var(--amber-soft); color: var(--on-amber-soft); }
  .mile.future .dot { background: var(--neutral-soft); color: var(--on-neutral-soft); }
  .mile .mname { flex: 1; font-size: 13.5px; font-weight: 600; color: var(--text); }
  .mile.done .mname { color: var(--text-muted); text-decoration: line-through; text-decoration-color: currentColor; font-weight: 500; }
  .mile .mdate { font-size: 12.5px; color: var(--text-soft); white-space: nowrap; font-weight: 600; }
  .mile.late .mdate, .mile.late .mname { color: var(--on-danger-soft); font-weight: 700; }
  .mile.soon .mdate { color: var(--on-amber-soft); font-weight: 700; }

  /* ============================================================
     CONTACTS & DETAILS
     ============================================================ */
  details.contacts { margin-top: 12px; }
  details.contacts summary {
    cursor: pointer; font-size: 13px; font-weight: 800; color: var(--primary-strong);
    background: var(--primary-soft);
    padding: 11px 14px; border-radius: var(--radius-sm); list-style: none;
    display: flex; justify-content: space-between; align-items: center;
  }
  details.contacts summary::-webkit-details-marker { display: none; }
  details.contacts summary::after { content: "▾"; font-size: 12px; }
  details.contacts[open] summary::after { content: "▴"; }
  .csec { margin: 14px 2px 14px; }
  .ctitle {
    font-size: 11px; font-weight: 800; letter-spacing: 0.8px; text-transform: uppercase;
    color: var(--primary-strong); margin-bottom: 5px;
  }
  .crow { display: flex; gap: 10px; padding: 3.5px 0; font-size: 13px; }
  .clabel { flex: 0 0 112px; color: var(--text-muted); font-weight: 600; }
  .cval { flex: 1; color: var(--text); word-break: break-word; font-weight: 500; }
  .cval a { color: var(--primary-strong); text-decoration: none; font-weight: 700; }

  /* past transactions */
  details.past { margin-top: 10px; }
  details.past summary {
    cursor: pointer; font-size: 13.5px; font-weight: 800; color: var(--text-soft);
    padding: 12px 4px; list-style: none;
  }
  details.past summary::-webkit-details-marker { display: none; }
  details.past summary::before { content: "▸ "; }
  details.past[open] summary::before { content: "▾ "; }
  details.past .deal { opacity: 0.8; }

  /* ============================================================
     STATES + FOOTER
     ============================================================ */
  .state { text-align: center; padding: 56px 24px; color: var(--text-soft); }
  .state .big { font-size: 42px; margin-bottom: 12px; }
  .state h2 { font-size: 17px; color: var(--text); margin-bottom: 6px; font-weight: 800; }
  .state p { font-size: 14px; max-width: 420px; margin: 0 auto; }
  .spinner {
    width: 34px; height: 34px; margin: 0 auto 14px;
    border: 3px solid var(--primary-soft); border-top-color: var(--primary);
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  footer { text-align: center; padding: 26px 16px 40px; font-size: 12.5px; color: var(--text-muted); font-weight: 500; }
  footer a { color: var(--primary-strong); text-decoration: none; font-weight: 700; }
  .updated { font-size: 11.5px; color: var(--text-muted); text-align: center; margin: 6px 0 0; font-weight: 600; }

  .print-btn {
    display: block; width: 100%; margin-top: 12px; padding: 10px;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm);
    color: var(--text-soft); font-size: 12.5px; font-weight: 700; cursor: pointer; font-family: inherit;
  }

  /* ---------- referral card + congrats banner ---------- */
  .refer-card {
    background: var(--primary-soft); border: 1.5px dashed var(--primary);
    border-radius: var(--radius); padding: 18px; margin: 20px 0 6px; text-align: center;
  }
  .refer-card h3 { font-size: 15.5px; font-weight: 800; color: var(--primary-strong); margin-bottom: 6px; }
  .refer-card p { font-size: 13px; color: var(--text-soft); font-weight: 600; max-width: 430px; margin: 0 auto 14px; }
  .refer-card p b { color: var(--text); }
  .refer-btn {
    display: inline-block; background: var(--indigo-deep, #4338CA); background: var(--primary);
    color: #fff; border: none; padding: 12px 22px; border-radius: 12px;
    font-size: 14px; font-weight: 800; cursor: pointer; font-family: inherit;
  }
  :root[data-theme="dark"] .refer-btn { background: #4A3FE0; }
  .refer-fb { display: none; margin-top: 10px; font-size: 12.5px; font-weight: 700; color: var(--on-success-soft); }

  a.congrats {
    display: flex; gap: 10px; align-items: center; text-decoration: none;
    background: var(--success-soft); color: var(--on-success-soft);
    border-radius: var(--radius) var(--radius) 0 0; padding: 14px 16px; margin: 0;
    font-size: 13.5px; font-weight: 700; box-shadow: var(--shadow); cursor: pointer;
  }
  a.rev-ask {
    display: block; text-decoration: none; text-align: center;
    background: var(--primary-soft); color: var(--primary-strong);
    border-radius: 0 0 var(--radius) var(--radius); padding: 11px 16px; margin: 2px 0 16px;
    font-size: 12.5px; font-weight: 800; box-shadow: var(--shadow);
  }

  /* ============================================================
     PRINT — branded per-transaction overview (black on white)
     ============================================================ */
  #printview { display: none; }
  @media print {
    body { background: #fff !important; }
    header.hero, main.shell, footer { display: none !important; }
    #printview { display: block !important; }
  }
  #printview { color: #16183A; font-size: 12px; line-height: 1.5; }
  #printview .p-head { display: flex; justify-content: space-between; align-items: baseline;
    border-bottom: 3px solid #4338CA; padding-bottom: 8px; margin-bottom: 14px; }
  #printview .p-brand { font-size: 13px; font-weight: 800; letter-spacing: 1.5px; color: #1E1B4B; }
  #printview .p-brand b { color: #4338CA; }
  #printview .p-kind { font-size: 11px; font-weight: 700; color: #666; text-transform: uppercase; letter-spacing: 1px; }
  #printview h1 { font-size: 19px; font-weight: 800; margin: 0 0 2px; color: #16183A; }
  #printview .p-meta { font-size: 12px; color: #555; font-weight: 600; margin-bottom: 12px; }
  #printview table { width: 100%; border-collapse: collapse; margin-bottom: 14px; }
  #printview th { text-align: left; font-size: 9.5px; font-weight: 800; text-transform: uppercase;
    letter-spacing: 0.6px; color: #777; padding: 5px 8px; border-bottom: 1.5px solid #bbb; }
  #printview td { padding: 5px 8px; border-bottom: 1px solid #e2e2e2; font-size: 11.5px; vertical-align: top; }
  #printview h2 { font-size: 12px; font-weight: 800; color: #4338CA; text-transform: uppercase;
    letter-spacing: 0.8px; margin: 14px 0 5px; border-bottom: 1px solid #ddd; padding-bottom: 3px; }
  #printview .p-sec { break-inside: avoid; }
  #printview .p-kv { display: flex; gap: 10px; padding: 2.5px 0; font-size: 11.5px; }
  #printview .p-kv .k { flex: 0 0 150px; color: #777; font-weight: 600; }
  #printview .p-kv .v { flex: 1; font-weight: 600; }
  #printview .p-foot { margin-top: 18px; padding-top: 8px; border-top: 1.5px solid #bbb;
    font-size: 10px; color: #777; text-align: center; line-height: 1.6; }
</style>
<script>
  // Apply the theme BEFORE first paint: saved choice, else system preference.
  (function () {
    var t = null;
    try { t = localStorage.getItem('mrfl_portal_theme'); } catch (e) {}
    if (t !== 'dark' && t !== 'light') {
      t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
</head>
<body>

<header class="hero">
  <div class="shell hero-top">
    <div class="hero-actions">
      <button id="theme_btn" title="Switch light / dark" aria-label="Switch theme">🌙</button>
      <button id="refresh" title="Refresh" aria-label="Refresh">↻</button>
    </div>
  </div>
  <div class="shell hero-greet">
    <h1 id="welcome">My Transactions</h1>
  </div>
</header>

<main class="shell" id="main">
  <div class="state" id="loading" style="padding-top:80px">
    <div class="spinner"></div>
    <p>Loading your transactions…</p>
  </div>
</main>

<footer>

</footer>

<div id="printview" aria-hidden="true"></div>

<script>
(function () {
  'use strict';

  var CFG_KEY = 'mrfl_portal_cfg';
  var THEME_KEY = 'mrfl_portal_theme';

  // Webhook web-app URL used by SHORT links (?a=&k=). Safe to publish: the
  // endpoint returns data only with a valid per-agent or widget key.
  var PORTAL_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzheiPICRaOkutzU6kkrNS3n1pVebVVMtMwqAyQtDinMrzbqnaeTxFdHaqCeKtveKEzBw/exec';

  // Referral landing page (update host when the custom domain goes live).
  var REFER_BASE = 'https://mrfl-transactions.vercel.app/refer/';
  var SITE_BASE = REFER_BASE.replace(/refer\/$/, '');   // public site root (reviews live at #reviews)

  // ---------- theme toggle ----------
  function currentTheme() {
    return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  }
  function applyTheme(t, persist) {
    document.documentElement.setAttribute('data-theme', t);
    var btn = document.getElementById('theme_btn');
    if (btn) btn.textContent = (t === 'dark') ? '☀️' : '🌙';
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', t === 'dark' ? '#0E1120' : '#1D2144');
    if (persist) { try { localStorage.setItem(THEME_KEY, t); } catch (e) {} }
  }
  applyTheme(currentTheme(), false);  // sync button glyph + meta with pre-paint theme
  document.getElementById('theme_btn').addEventListener('click', function () {
    applyTheme(currentTheme() === 'dark' ? 'light' : 'dark', true);
  });

  // ---------- config: URL params, falling back to localStorage ----------
  function readConfig() {
    var q = new URLSearchParams(location.search);
    // Short form: ?a=Agent&k=key (endpoint baked into this page)
    var short = { agent: q.get('a') || '', key: q.get('k') || '', short: true };
    if (short.agent && short.key) {
      try { localStorage.setItem(CFG_KEY, JSON.stringify(short)); } catch (e) {}
      return short;
    }
    // Legacy form: ?u=<b64 endpoint>&agent=&key=
    var cfg = { u: q.get('u') || '', agent: q.get('agent') || '', key: q.get('key') || '' };
    if (cfg.u && cfg.agent && cfg.key) {
      try { localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); } catch (e) {}
      return cfg;
    }
    try {
      var saved = JSON.parse(localStorage.getItem(CFG_KEY) || 'null');
      if (saved && (saved.u || saved.short) && saved.agent && saved.key) return saved;
    } catch (e) {}
    return null;
  }

  function decodeEndpoint(u) {
    try {
      var b64 = u.replace(/-/g, '+').replace(/_/g, '/');
      while (b64.length % 4) b64 += '=';
      var url = atob(b64);
      // Only ever talk to Google Apps Script endpoints.
      if (/^https:\/\/script\.google(?:usercontent)?\.com\//.test(url)) return url;
    } catch (e) {}
    return null;
  }

  // ---------- date helpers (parse YYYY-MM-DD as LOCAL date) ----------
  var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function parseLocal(iso) {
    var m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (!m) return null;
    return new Date(+m[1], +m[2] - 1, +m[3]);
  }
  function fmt(iso) {
    var d = parseLocal(iso);
    if (!d) return '';
    return MONTHS[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
  }
  function fmtShort(iso) {
    var d = parseLocal(iso);
    if (!d) return '';
    return MONTHS[d.getMonth()] + ' ' + d.getDate();
  }
  function daysFromToday(iso) {
    var d = parseLocal(iso);
    if (!d) return null;
    var t = new Date(); t.setHours(0, 0, 0, 0);
    return Math.round((d - t) / 86400000);
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function shortAddr(p) { return String(p || '').split(',')[0]; }

  var STATUS_LABEL = {
    on_track: 'On track', active: 'Active', warning: 'Deadline soon',
    urgent: 'Urgent', past_due: 'Past due', closed: 'Closed',
    cancelled: 'Cancelled', on_hold: 'On hold', unknown: 'Active'
  };
  var SIDE_LABEL = { Seller: 'Listing side', Buyer: 'Buyer side', Both: 'Double sided' };
  var DONE = { closed: 1, cancelled: 1 };

  // ---------- renderers ----------
  function inWords(n) {
    if (n === null || n === undefined) return '';
    if (n < 0) return Math.abs(n) + (n === -1 ? ' day' : ' days') + ' overdue';
    if (n === 0) return 'today';
    if (n === 1) return 'tomorrow';
    return 'in ' + n + ' days';
  }

  function mileClass(m) {
    if (m.completed) return 'done';
    var d = daysFromToday(m.date);
    if (d === null) return 'future';
    if (d < 0) return 'late';
    if (d <= 7) return 'soon';
    return 'future';
  }
  function mileIcon(cls) {
    return { done: '✓', late: '!', soon: '●', future: '○' }[cls] || '○';
  }

  // Emails → tap-to-email, phones → tap-to-call; everything else plain text.
  function contactValue(label, value) {
    var l = String(label || '').toLowerCase();
    var v = String(value || '');
    if (/email/.test(l) && v.indexOf('@') > 0) {
      return '<a href="mailto:' + esc(v) + '">' + esc(v) + '</a>';
    }
    if (/phone|mobile/.test(l)) {
      var digits = v.replace(/[^\d+]/g, '');
      if (digits.length >= 10) return '<a href="tel:' + esc(digits) + '">' + esc(v) + '</a>';
    }
    return esc(v);
  }

  function dealCard(deal) {
    var isDone = !!DONE[deal.status];
    var h = '<div class="deal">';
    h += '<div class="deal-head"><div>';
    h += '<div class="deal-addr">' + esc(deal.property) + '</div>';
    h += '<div class="pills">';
    if (deal.side) h += '<span class="pill side">' + esc(SIDE_LABEL[deal.side] || deal.side) + '</span>';
    h += '<span class="pill st-' + esc(deal.status) + '">' + esc(STATUS_LABEL[deal.status] || deal.status) + '</span>';
    h += '</div></div>';
    if (!isDone && deal.progress_total && deal.progress_elapsed !== null && deal.progress_elapsed !== undefined) {
      h += '<div class="daypill">Day ' + deal.progress_elapsed + ' of ' + deal.progress_total + '</div>';
    }
    h += '</div>';

    if (!isDone && deal.progress_total) {
      var pct = Math.max(2, Math.min(100, Math.round(100 * deal.progress_elapsed / deal.progress_total)));
      h += '<div class="progress"><div style="width:' + pct + '%"></div></div>';
      h += '<div class="progress-lbl">' + fmtShort(deal.effective_date) + ' → closing ' + fmt(deal.closing_date) + '</div>';
    }

    if (!isDone && deal.next_deadline && deal.next_deadline_date) {
      var overdue = deal.days_until !== null && deal.days_until < 0;
      h += '<div class="callout' + (overdue ? ' red' : '') + '">⏰&nbsp;<div>Next: <b>' +
        esc(deal.next_deadline) + '</b> — ' + fmt(deal.next_deadline_date) +
        (deal.days_until !== null ? ' (' + inWords(deal.days_until) + ')' : '') + '</div></div>';
    }

    if (deal.milestones && deal.milestones.length) {
      h += '<div class="miles">';
      deal.milestones.forEach(function (m) {
        var cls = isDone ? (m.completed ? 'done' : 'future') : mileClass(m);
        h += '<div class="mile ' + cls + '"><div class="dot">' + mileIcon(cls) + '</div>' +
          '<div class="mname">' + esc(m.name) + '</div>' +
          '<div class="mdate">' + fmt(m.date) + '</div></div>';
      });
      h += '</div>';
    }

    if (deal.details && deal.details.length) {
      h += '<details class="contacts"><summary>Contacts &amp; details</summary>';
      deal.details.forEach(function (sec) {
        h += '<div class="csec"><div class="ctitle">' + esc(sec.title) + '</div>';
        (sec.items || []).forEach(function (it) {
          h += '<div class="crow">' +
            (it.label ? '<div class="clabel">' + esc(it.label) + '</div>' : '') +
            '<div class="cval">' + contactValue(it.label, it.value) + '</div></div>';
        });
        h += '</div>';
      });
      h += '</details>';
    }
    if (typeof deal.__i === 'number') {
      h += '<button type="button" class="print-btn" data-print="' + deal.__i + '">🖨 Print / save as PDF</button>';
    }
    h += '</div>';
    return h;
  }

  // ---------- per-transaction print view ----------
  function buildPrintHtml(d) {
    var now = new Date();
    var status = STATUS_LABEL[d.status] || d.status;
    var side = d.side ? (SIDE_LABEL[d.side] || d.side) : '';
    var h = '<div class="p-doc">';
    h += '<div class="p-head"><span class="p-brand">MRFL <b>TRANSACTIONS</b></span>' +
      '<span class="p-kind">Transaction Overview</span></div>';
    h += '<h1>' + esc(d.property) + '</h1>';
    var agentName = d.agent || (LAST && LAST.agent) || '';
    h += '<div class="p-meta">Agent: ' + esc(agentName) + (side ? ' · ' + esc(side) : '') +
      ' · Status: ' + esc(status) + '</div>';

    h += '<table><tr><th>Effective date</th><th>Closing date</th><th>Progress</th><th>Next deadline</th></tr><tr>';
    h += '<td>' + fmt(d.effective_date) + '</td><td>' + fmt(d.closing_date) + '</td>';
    h += '<td>' + (d.progress_total ? 'Day ' + d.progress_elapsed + ' of ' + d.progress_total : '—') + '</td>';
    h += '<td>' + (d.next_deadline ? esc(d.next_deadline) + ' — ' + fmt(d.next_deadline_date) +
      (d.days_until !== null && d.days_until !== undefined ? ' (' + esc(inWords(d.days_until)) + ')' : '') : '—') + '</td>';
    h += '</tr></table>';

    if (d.milestones && d.milestones.length) {
      h += '<div class="p-sec"><h2>Milestones</h2><table><tr><th>Milestone</th><th>Date</th><th>Status</th></tr>';
      d.milestones.forEach(function (m) {
        var st = m.completed ? '✓ Completed'
          : (function () { var n = daysFromToday(m.date); return (n !== null && n < 0) ? '⚠ Past due' : '◻ Upcoming'; })();
        h += '<tr><td>' + esc(m.name) + '</td><td>' + fmt(m.date) + '</td><td>' + st + '</td></tr>';
      });
      h += '</table></div>';
    }

    (d.details || []).forEach(function (sec) {
      h += '<div class="p-sec"><h2>' + esc(sec.title) + '</h2>';
      (sec.items || []).forEach(function (it) {
        h += '<div class="p-kv">' + (it.label ? '<span class="k">' + esc(it.label) + '</span>' : '') +
          '<span class="v">' + esc(it.value) + '</span></div>';
      });
      h += '</div>';
    });

    h += '<div class="p-foot">Prepared by Gloria Grullon · MRFL Transactions · (401) 282-8414 · MRFLTransactions@gmail.com<br>' +
      'Generated ' + now.toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' }) + ' at ' +
      now.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) + ' — live from the MRFL tracking sheet</div>';
    h += '</div>';
    return h;
  }

  var LAST = null;  // last successful payload (for printing + referrals)
  document.addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('[data-print]') : null;
    if (btn && LAST) {
      var d = (LAST.deals || [])[+btn.getAttribute('data-print')];
      if (!d) return;
      document.getElementById('printview').innerHTML = buildPrintHtml(d);
      window.print();
      return;
    }
    var share = e.target.closest ? e.target.closest('[data-share]') : null;
    if (share && LAST) {
      e.preventDefault();
      shareInvite();
    }
  });

  // ---------- referral invite sharing ----------
  function shareInvite() {
    var name = (LAST && LAST.agent) || '';
    var link = REFER_BASE + '?from=' + encodeURIComponent(name);
    var msg = 'Hey! I use MRFL Transactions to run my deals — contract to close, every deadline handled. ' +
      'Through my invite your first transaction is 50% off ($250 single side / $350 double sided), ' +
      'and you only pay when it closes. Check it out: ' + link;
    if (navigator.share) {
      navigator.share({ text: msg }).catch(function () { /* user cancelled — fine */ });
      return;
    }
    var done = function () {
      var fb = document.getElementById('refer_fb');
      if (fb) { fb.style.display = 'block'; setTimeout(function () { fb.style.display = 'none'; }, 3500); }
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(msg).then(done).catch(function () { legacyCopy(msg); done(); });
    } else {
      legacyCopy(msg); done();
    }
  }
  function legacyCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;left:-9999px;top:0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    ta.remove();
  }

  function render(data) {
    LAST = data;
    var main = document.getElementById('main');
    document.getElementById('welcome').textContent = 'Hello, ' + data.agent + '! 👋';

    data.deals.forEach(function (d, i) { d.__i = i; });
    var active = data.deals.filter(function (d) { return !DONE[d.status]; });
    var past = data.deals.filter(function (d) { return DONE[d.status]; });

    var closingSoon = active.filter(function (d) {
      var n = daysFromToday(d.closing_date);
      return n !== null && n >= 0 && n <= 7;
    }).length;

    // Most urgent upcoming deadline across active deals — overdue (negative
    // days) ranks first, since that needs attention most.
    var next = null;
    active.forEach(function (d, idx) {
      if (d.days_until === null || !d.next_deadline) return;
      if (next === null || d.days_until < next.days) next = { deal: d, days: d.days_until, idx: idx };
    });

    var h = '';

    // 🎉 just-closed congrats → the highest-intent referral moment
    var justClosed = past.filter(function (d) {
      var n = daysFromToday(d.closing_date);
      return d.status === 'closed' && n !== null && n <= 0 && n >= -14;
    })[0];
    if (justClosed) {
      h += '<a class="congrats" data-share="1">🎉&nbsp;<span>Congrats on closing <b>' +
        esc(shortAddr(justClosed.property)) + '</b>! Know an agent who\'d love this support? ' +
        'You both save — share your invite →</span></a>' +
        '<a class="rev-ask" href="' + SITE_BASE + '#reviews" target="_blank" rel="noopener">' +
        '⭐ Loved working together? Leave a quick review →</a>';
    }

    h += '<div class="stats">';
    h += '<div class="stat"><div class="ic blue">🏠</div><div class="num">' + active.length + '</div><div class="lbl">Active deal' + (active.length === 1 ? '' : 's') + '</div></div>';
    h += '<div class="stat"><div class="ic amber">📆</div><div class="num">' + closingSoon + '</div><div class="lbl">Closing in 7 days</div></div>';
    h += '<div class="stat"><div class="ic amber">⏰</div><div class="num">' + (next === null ? '—' : (next.days < 0 ? '❗' : (next.days === 0 ? 'Today' : next.days + 'd'))) + '</div><div class="lbl">Next deadline</div></div>';
    h += '</div>';

    if (next !== null) {
      var overdue = next.days < 0;
      h += '<a class="next-banner' + (overdue ? ' red' : '') + '" href="#deal_' + next.idx + '">' +
        '<span class="nb-main"><span class="nb-k">' + (overdue ? '❗ Past due — needs attention' : '⏰ Next deadline') + '</span>' +
        '<span class="nb-what">' + esc(next.deal.next_deadline) + '</span>' +
        '<span class="nb-when">' + fmt(next.deal.next_deadline_date) + ' · ' + inWords(next.days) + '</span>' +
        '<span class="nb-prop">📍 ' + esc(next.deal.property) + '</span></span>' +
        '<span class="nb-go">→</span></a>';
    }

    if (active.length === 0 && past.length === 0) {
      h += '<div class="state"><div class="big">🌴</div><h2>No transactions yet</h2>' +
        '<p>When Gloria opens a transaction for you, it will show up here automatically.</p></div>';
    } else {
      if (active.length) {
        h += '<div class="section-title">Active transactions</div>';
        active.forEach(function (d, idx) { h += '<div id="deal_' + idx + '">' + dealCard(d) + '</div>'; });
      } else {
        h += '<div class="state"><div class="big">✅</div><h2>No active deals right now</h2>' +
          '<p>Your past transactions are below. New deals appear here automatically.</p></div>';
      }
      // 🎁 referral card
      h += '<div class="refer-card"><h3>🎁 Refer an agent — you both save</h3>' +
        '<p>Give a colleague <b>50% off their first transaction</b> ($250 single side · $350 double sided), ' +
        'and get <b>50% off your next one</b> when their first deal closes.</p>' +
        '<button type="button" class="refer-btn" data-share="1">📲 Share your invite</button>' +
        '<div class="refer-fb" id="refer_fb">✓ Invite copied — paste it into a text or email!</div></div>';

      if (past.length) {
        h += '<details class="past"><summary>Past transactions (' + past.length + ')</summary>';
        past.forEach(function (d) { h += dealCard(d); });
        h += '</details>';
      }
    }

    var t = new Date();
    h += '<div class="updated">Updated ' + t.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) + ' — live from Gloria’s tracking sheet</div>';
    main.innerHTML = h;
  }

  function showState(icon, title, body) {
    document.getElementById('main').innerHTML =
      '<div class="state"><div class="big">' + icon + '</div><h2>' + esc(title) + '</h2><p>' + body + '</p></div>';
  }

  // ---------- load ----------
  var cfg = readConfig();
  var endpoint = cfg ? (cfg.u ? decodeEndpoint(cfg.u) : (PORTAL_ENDPOINT || null)) : null;
  var loading = false;

  function load() {
    if (loading) return;
    if (cfg && cfg.short && !PORTAL_ENDPOINT) {
      showState('🛠', 'Almost ready',
        'The portal is being upgraded right now — try again in a few minutes. ' +
        'If this keeps showing, let Gloria know.');
      return;
    }
    if (!cfg || !endpoint) {
      showState('🔒', 'This page needs your personal link',
        'Open the portal using the private link Gloria sent you. If you lost it, just ask her for a fresh one.');
      return;
    }
    loading = true;
    var url = endpoint + '?view=portal&agent=' + encodeURIComponent(cfg.agent) + '&key=' + encodeURIComponent(cfg.key);
    fetch(url, { method: 'GET', cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        loading = false;
        if (!data.success) {
          // The webhook answered, but with a pre-portal payload — the deployed
          // version is older than v6.6. Surface that clearly instead of "invalid".
          if (data.status === 'ok' || data.generated_at) {
            showState('🛠', 'Almost ready',
              'The portal isn’t switched on yet on Gloria’s side. Let her know you saw this. ' +
              '<span style="opacity:.7">(For Gloria: the webhook deployment is running an older version — ' +
              'open Apps Script → Deploy → Manage deployments and update it to a New version.)</span>');
            return;
          }
          showState('🔒', 'Link not valid',
            esc(data.error || 'Ask Gloria for a fresh portal link.'));
          return;
        }
        render(data);
      })
      .catch(function () {
        loading = false;
        showState('📶', 'Couldn’t load right now',
          'Check your internet connection and pull to refresh, or tap the ↻ button. If it keeps happening, let Gloria know.');
      });
  }

  document.getElementById('refresh').addEventListener('click', function () {
    document.getElementById('main').innerHTML =
      '<div class="state" id="loading" style="padding-top:80px"><div class="spinner"></div><p>Refreshing…</p></div>';
    load();
  });

  // Refresh when the page becomes visible again (e.g., reopened from home screen)
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') load();
  });

  load();
})();
</script>
</body>
</html>
