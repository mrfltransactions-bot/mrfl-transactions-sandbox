<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0D18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MRFL HQ">
<meta name="robots" content="noindex, nofollow">
<title>MRFL · My Overview</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖥</text></svg>">
<style>
  /* ============================================================
     THEME TOKENS — dark glass (hero) + light glass
     ============================================================ */
  :root {
    --bg0:        #EDF0FA;
    --blob1:      rgba(167, 139, 250, 0.45);
    --blob2:      rgba(96, 165, 250, 0.45);
    --blob3:      rgba(232, 121, 249, 0.30);

    --glass:      rgba(255, 255, 255, 0.72);
    --glass2:     rgba(255, 255, 255, 0.92);
    --bd:         rgba(25, 29, 58, 0.10);
    --spec:       rgba(255, 255, 255, 0.95);   /* specular top edge */

    --text:       #181C38;
    --soft:       #454C70;
    --muted:      #596080;

    --cta:        #2563EB;
    --on-cta:     #FFFFFF;

    --red-t:      #B4232A;   /* text-safe accents */
    --amber-t:    #8A5B00;
    --green-t:    #0B7A55;
    --blue-t:     #1D4FD7;
    --purple-t:   #6D28D9;

    --red-s:      rgba(217, 45, 51, 0.12);   /* soft chip bgs */
    --amber-s:    rgba(246, 167, 35, 0.16);
    --green-s:    rgba(23, 166, 115, 0.14);
    --blue-s:     rgba(37, 99, 235, 0.12);
    --purple-s:   rgba(109, 40, 217, 0.10);
    --gray-s:     rgba(25, 29, 58, 0.07);

    --bar-red:    #E0353B;   /* decorative edge bars */
    --bar-amber:  #F6A723;
    --bar-green:  #17A673;
    --bar-blue:   #3B82F6;
    --bar-gray:   #9AA1C4;

    --shadow:     0 12px 30px -12px rgba(25, 29, 58, 0.22);
    --glow:       0 6px 22px rgba(37, 99, 235, 0.45);
  }
  :root[data-theme="dark"] {
    --bg0:        #0A0716;      /* deep violet-black, aurora behind glass */
    --blob1:      rgba(139, 92, 246, 0.55);
    --blob2:      rgba(37, 99, 235, 0.50);
    --blob3:      rgba(217, 70, 239, 0.38);

    --glass:      rgba(255, 255, 255, 0.07);
    --glass2:     rgba(255, 255, 255, 0.12);
    --bd:         rgba(255, 255, 255, 0.14);
    --spec:       rgba(255, 255, 255, 0.28);   /* specular top edge */

    --text:       #F2F4FF;
    --soft:       #C0C6E4;
    --muted:      #99A1C8;

    --cta:        #2563EB;
    --on-cta:     #FFFFFF;

    --red-t:      #FF8189;
    --amber-t:    #FFC163;
    --green-t:    #4FE3AC;
    --blue-t:     #8AB6FF;
    --purple-t:   #C4B5FD;

    --red-s:      rgba(255, 77, 85, 0.16);
    --amber-s:    rgba(255, 176, 32, 0.14);
    --green-s:    rgba(52, 211, 153, 0.13);
    --blue-s:     rgba(77, 141, 255, 0.15);
    --purple-s:   rgba(167, 139, 250, 0.14);
    --gray-s:     rgba(255, 255, 255, 0.08);

    --bar-red:    #FF4D55;
    --bar-amber:  #FFB020;
    --bar-green:  #34D399;
    --bar-blue:   #4D8DFF;
    --bar-gray:   #6F77A0;

    --shadow:     0 12px 30px -12px rgba(0, 0, 0, 0.65);
    --glow:       0 6px 26px rgba(99, 102, 241, 0.65), 0 0 18px rgba(217, 70, 239, 0.25);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  html, body {
    background: var(--bg0);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    font-size: 15px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    /* no background/color transitions on html/body — wedges theme switch in Blink */
  }
  /* ambient glow blobs */
  body::before, body::after {
    content: ""; position: fixed; z-index: -1; border-radius: 50%;
    filter: blur(90px); pointer-events: none;
  }
  body::before { width: 480px; height: 480px; top: -130px; left: -130px;
    background: radial-gradient(circle, var(--blob1), transparent 70%); }
  body::after { width: 540px; height: 540px; bottom: -180px; right: -160px;
    background: radial-gradient(circle, var(--blob2), transparent 70%); }
  /* third aurora blob — magenta, mid-right like the reference */
  #blob3 { position: fixed; z-index: -1; width: 420px; height: 420px;
    top: 32%; right: -180px; border-radius: 50%; filter: blur(95px);
    background: radial-gradient(circle, var(--blob3), transparent 70%);
    pointer-events: none; }

  .app { max-width: 620px; margin: 0 auto; padding: 18px 16px 118px; }

  /* ============================================================
     GLASS PRIMITIVES
     ============================================================ */
  .g {
    background: var(--glass);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    border: 1px solid var(--bd);
    border-radius: 22px;
    box-shadow: inset 0 1px 0 var(--spec), var(--shadow);
  }
  .tap { cursor: pointer; text-decoration: none; color: inherit; display: block; }
  .tap:active { transform: scale(0.985); }

  /* ============================================================
     HEADER
     ============================================================ */
  .hdr { display: flex; align-items: center; gap: 12px; margin: 4px 2px 18px; }
  .avatar {
    width: 52px; height: 52px; border-radius: 50%; flex: none;
    background-color: #6D28D9; /* solid fallback so contrast audits see it */
    background-image: linear-gradient(135deg, #7C3AED, #2563EB);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 800; font-size: 20px;
    box-shadow: 0 0 0 2.5px var(--bg0), 0 0 0 4.5px #F6A723;
  }
  .hdr .hi { flex: 1; min-width: 0; }
  .hdr .hi .gd { font-size: 12.5px; color: var(--muted); font-weight: 700; }
  .hdr .hi .nm { font-size: 21px; font-weight: 800; letter-spacing: -0.3px; line-height: 1.25; }
  .hbtn {
    width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--bd);
    background: var(--glass); color: var(--text); font-size: 17px; cursor: pointer;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    display: inline-flex; align-items: center; justify-content: center; flex: none;
  }

  /* search */
  .search { display: flex; align-items: center; gap: 9px; padding: 12px 16px; margin-bottom: 18px; border-radius: 18px; }
  .search input {
    flex: 1; background: transparent; border: none; outline: none;
    color: var(--text); font-size: 14.5px; font-weight: 600; font-family: inherit;
  }
  .search input::placeholder { color: var(--muted); font-weight: 600; }
  .search .mag { color: var(--muted); font-size: 15px; }

  /* section titles */
  .sec { display: flex; align-items: baseline; justify-content: space-between; margin: 20px 4px 10px; }
  .sec h2 { font-size: 16.5px; font-weight: 800; letter-spacing: -0.2px; }
  .sec .more { font-size: 12.5px; font-weight: 700; color: var(--muted); text-decoration: none; }

  /* ============================================================
     STAT CARDS (tappable)
     ============================================================ */
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .stat { padding: 15px 16px; display: flex; align-items: center; gap: 12px; border-radius: 20px; }
  .stat .ic {
    width: 42px; height: 42px; border-radius: 14px; flex: none;
    display: flex; align-items: center; justify-content: center; font-size: 19px;
  }
  .stat .ic.blue { background: var(--blue-s); } .stat .ic.red { background: var(--red-s); }
  .stat .ic.amber { background: var(--amber-s); } .stat .ic.green { background: var(--green-s); }
  .stat .num { font-size: 21px; font-weight: 800; line-height: 1.1; }
  .stat .lbl { font-size: 11.5px; color: var(--soft); font-weight: 700; }
  .stat .chev { margin-left: auto; color: var(--muted); font-size: 15px; }

  /* ============================================================
     DAY PILLS + TIMELINE
     ============================================================ */
  .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
  .day {
    border-radius: 16px; padding: 9px 4px 8px; text-align: center; cursor: pointer;
    border: 1px solid var(--bd); background: var(--glass);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  .day .dw { font-size: 10px; font-weight: 800; letter-spacing: 0.6px; color: var(--muted); text-transform: uppercase; }
  .day .dn { font-size: 16.5px; font-weight: 800; margin-top: 1px; }
  .day .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--bar-amber); margin: 4px auto 0; }
  .day .dot.off { visibility: hidden; }
  .day.on {
    background-color: var(--cta);
    background-image: linear-gradient(160deg, #3B82F6, #2563EB);
    border-color: transparent; box-shadow: var(--glow);
  }
  .day.on .dw, .day.on .dn { color: #fff; }
  .day.on .dot { background: #fff; }

  .tl { margin-top: 14px; }
  .tl-item { display: flex; gap: 12px; padding: 13px 14px; border-radius: 18px; margin-bottom: 10px; align-items: center; }
  .ebar { width: 4px; border-radius: 4px; align-self: stretch; flex: none; }
  .tl-item .t-main { flex: 1; min-width: 0; }
  .tl-item .t-what { font-size: 14px; font-weight: 800; }
  .tl-item .t-sub { font-size: 12px; color: var(--soft); font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tl-item .chev { color: var(--muted); flex: none; }
  .tl-empty { font-size: 13px; color: var(--muted); font-weight: 600; padding: 14px 6px; text-align: center; }

  /* ============================================================
     LIST ROWS (deals / agents / attention)
     ============================================================ */
  .row { display: flex; gap: 12px; padding: 14px; border-radius: 20px; margin-bottom: 12px; align-items: center; }
  .row .r-main { flex: 1; min-width: 0; }
  .row .r-title { display: block; font-size: 14.5px; font-weight: 800; line-height: 1.35; }
  .row .r-sub { display: block; font-size: 12px; color: var(--soft); font-weight: 600; margin-top: 2px; }
  .row .chev { color: var(--muted); flex: none; font-size: 16px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
  .chip {
    font-size: 10.5px; font-weight: 800; padding: 3.5px 9px; border-radius: 999px;
    background: var(--gray-s); color: var(--soft);
  }
  .chip.red   { background: var(--red-s);   color: var(--red-t); }
  .chip.amber { background: var(--amber-s); color: var(--amber-t); }
  .chip.green { background: var(--green-s); color: var(--green-t); }
  .chip.blue  { background: var(--blue-s);  color: var(--blue-t); }
  .chip.purple{ background: var(--purple-s);color: var(--purple-t); }

  .mini-prog { height: 6px; border-radius: 999px; background: var(--gray-s); overflow: hidden; margin-top: 9px; }
  .mini-prog > div { height: 100%; border-radius: 999px;
    background-color: #2563EB; background-image: linear-gradient(90deg, #A78BFA, #4D8DFF); }
  .r-next { font-size: 11.5px; font-weight: 700; color: var(--muted); margin-top: 6px; }
  .r-next b.red { color: var(--red-t); } .r-next b.amber { color: var(--amber-t); }

  .agent-av {
    width: 44px; height: 44px; border-radius: 50%; flex: none;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 800; font-size: 16px;
    background-color: #6D28D9; /* solid fallback so contrast audits see it */
    background-image: linear-gradient(135deg, #7C3AED, #2563EB);
  }

  /* ============================================================
     DETAIL VIEW
     ============================================================ */
  .dt-head { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .dt-head h1 { font-size: 18px; font-weight: 800; letter-spacing: -0.2px; flex: 1; line-height: 1.35; }
  .panel { padding: 16px; border-radius: 22px; margin-bottom: 14px; }
  .panel h3 { font-size: 13px; font-weight: 800; margin-bottom: 10px; color: var(--soft); text-transform: uppercase; letter-spacing: 0.7px; font-size: 11.5px; }
  .kv { display: flex; gap: 10px; padding: 4px 0; font-size: 13.5px; }
  .kv .k { flex: 0 0 118px; color: var(--muted); font-weight: 600; }
  .kv .v { flex: 1; font-weight: 600; word-break: break-word; }
  .kv .v a { color: var(--blue-t); text-decoration: none; font-weight: 700; }
  .mrow2 { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--bd); }
  .mrow2:last-child { border-bottom: none; }
  .mrow2 .mk { width: 24px; height: 24px; border-radius: 8px; flex: none; font-size: 12px; font-weight: 800;
    display: flex; align-items: center; justify-content: center; background: var(--gray-s); color: var(--muted); }
  .mrow2.on .mk { background: var(--green-s); color: var(--green-t); }
  .mrow2.late .mk { background: var(--red-s); color: var(--red-t); }
  .mrow2.soon .mk { background: var(--amber-s); color: var(--amber-t); }
  .mrow2 .mn { flex: 1; font-size: 13.5px; font-weight: 700; }
  .mrow2.on .mn { color: var(--muted); text-decoration: line-through; font-weight: 600; }
  .mrow2.late .mn { color: var(--red-t); }
  .mrow2 .md { font-size: 12px; color: var(--soft); font-weight: 700; white-space: nowrap; }
  .mrow2.late .md { color: var(--red-t); }
  .mrow2.soon .md { color: var(--amber-t); }
  .cta-btn {
    display: block; text-align: center; padding: 13px; border-radius: 16px;
    background-color: var(--cta); background-image: linear-gradient(160deg, #3B82F6, #2563EB);
    color: var(--on-cta); font-weight: 800; font-size: 14px; text-decoration: none;
    box-shadow: var(--glow); margin-bottom: 14px;
  }
  .cta-btn.ghost {
    background-color: transparent; background-image: none;
    background: var(--glass); border: 1px solid var(--bd); color: var(--text);
    box-shadow: none; cursor: pointer; width: 100%; font-family: inherit;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  }

  /* ============================================================
     PRINT — branded per-transaction overview (black on white)
     ============================================================ */
  #printview { display: none; }
  @media print {
    body { background: #fff !important; }
    body::before, body::after { display: none !important; }
    .app, .bnav { display: none !important; }
    #printview { display: block !important; }
  }
  #printview { color: #16183A; font-size: 12px; line-height: 1.5; }
  #printview .p-head { display: flex; justify-content: space-between; align-items: baseline;
    border-bottom: 3px solid #4338CA; padding-bottom: 8px; margin-bottom: 14px; }
  #printview .p-brand { font-size: 13px; font-weight: 800; letter-spacing: 1.5px; color: #1E1B4B; }
  #printview .p-brand b { color: #4338CA; }
  #printview .p-kind { font-size: 11px; font-weight: 700; color: #666; text-transform: uppercase; letter-spacing: 1px; }
  #printview h1 { font-size: 19px; font-weight: 800; margin: 0 0 2px; color: #16183A; }
  #printview .p-meta { font-size: 12px; color: #555; font-weight: 600; margin-bottom: 12px; }
  #printview table { width: 100%; border-collapse: collapse; margin-bottom: 14px; }
  #printview th { text-align: left; font-size: 9.5px; font-weight: 800; text-transform: uppercase;
    letter-spacing: 0.6px; color: #777; padding: 5px 8px; border-bottom: 1.5px solid #bbb; }
  #printview td { padding: 5px 8px; border-bottom: 1px solid #e2e2e2; font-size: 11.5px; vertical-align: top; }
  #printview h2 { font-size: 12px; font-weight: 800; color: #4338CA; text-transform: uppercase;
    letter-spacing: 0.8px; margin: 14px 0 5px; border-bottom: 1px solid #ddd; padding-bottom: 3px; }
  #printview .p-sec { break-inside: avoid; }
  #printview .p-kv { display: flex; gap: 10px; padding: 2.5px 0; font-size: 11.5px; }
  #printview .p-kv .k { flex: 0 0 150px; color: #777; font-weight: 600; }
  #printview .p-kv .v { flex: 1; font-weight: 600; }
  #printview .p-foot { margin-top: 18px; padding-top: 8px; border-top: 1.5px solid #bbb;
    font-size: 10px; color: #777; text-align: center; line-height: 1.6; }
  .callout2 {
    padding: 12px 14px; border-radius: 16px; font-size: 13px; font-weight: 700;
    background: var(--amber-s); color: var(--amber-t); margin-bottom: 14px;
  }
  .callout2.red { background: var(--red-s); color: var(--red-t); }

  /* ============================================================
     BOTTOM NAV
     ============================================================ */
  .bnav {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
    width: min(430px, calc(100% - 28px)); height: 64px; z-index: 50;
    border-radius: 999px; display: flex; align-items: center; justify-content: space-around;
    background: var(--glass2);
    backdrop-filter: blur(24px) saturate(160%); -webkit-backdrop-filter: blur(24px) saturate(160%);
    border: 1px solid var(--bd); box-shadow: inset 0 1px 0 var(--spec), var(--shadow);
  }
  .bnav a { color: var(--muted); font-size: 20px; text-decoration: none; width: 46px; height: 46px;
    display: flex; align-items: center; justify-content: center; border-radius: 50%; }
  .bnav a.on { color: var(--blue-t); }
  .bnav .plus {
    width: 54px; height: 54px; border-radius: 50%; margin-top: -26px;
    background-color: var(--cta); background-image: linear-gradient(160deg, #3B82F6, #7C3AED);
    color: #fff; font-size: 24px; font-weight: 800;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.4), var(--glow);
    border: 3px solid var(--bg0);
  }

  /* send-portal-link button on agent rows */
  .linkbtn {
    width: 40px; height: 40px; border-radius: 50%; flex: none; cursor: pointer;
    border: 1px solid var(--bd); background: var(--glass2); color: var(--blue-t);
    font-size: 15px; box-shadow: inset 0 1px 0 var(--spec);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  .linkbtn:active { transform: scale(0.92); }

  /* toast */
  #toast {
    position: fixed; left: 50%; bottom: 92px; transform: translateX(-50%);
    z-index: 60; max-width: min(400px, calc(100% - 40px));
    background: var(--glass2); color: var(--text);
    border: 1px solid var(--bd); border-radius: 999px; padding: 11px 20px;
    font-size: 13px; font-weight: 700; text-align: center;
    box-shadow: inset 0 1px 0 var(--spec), var(--shadow);
    backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%);
    display: none;
  }

  /* states */
  .state { text-align: center; padding: 80px 24px; color: var(--soft); }
  .state .big { font-size: 42px; margin-bottom: 12px; }
  .state h2 { font-size: 17px; color: var(--text); margin-bottom: 6px; font-weight: 800; }
  .state p { font-size: 14px; max-width: 420px; margin: 0 auto; }
  .spinner { width: 34px; height: 34px; margin: 0 auto 14px;
    border: 3px solid var(--blue-s); border-top-color: var(--cta);
    border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .updated { font-size: 11.5px; color: var(--muted); text-align: center; margin: 20px 0 0; font-weight: 600; }
</style>
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem('mrfl_dash_theme'); } catch (e) {}
    if (t !== 'dark' && t !== 'light') {
      t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
</head>
<body>
<div id="blob3" aria-hidden="true"></div>

<div class="app">
  <div class="hdr">
    <div class="avatar">G</div>
    <div class="hi">
      <div class="gd" id="gd">Good day 👋</div>
      <div class="nm">Gloria</div>
    </div>
    <button class="hbtn" id="theme_btn" title="Switch light / dark" aria-label="Switch theme">🌙</button>
    <button class="hbtn" id="refresh" title="Refresh" aria-label="Refresh">↻</button>
  </div>
  <main id="main">
    <div class="state"><div class="spinner"></div><p>Loading your transactions…</p></div>
  </main>
</div>

<nav class="bnav">
  <a href="#home" data-tab="home" title="Overview">🏠</a>
  <a href="#agents" data-tab="agents" title="Agents">👥</a>
  <a class="plus" id="sheetbtn" href="https://docs.google.com/spreadsheets/d/1HmBdzF8KRWvRFa01-QqmRIi9cKHF7Bh1-pf9jeDQ_7Y" target="_blank" rel="noopener" title="Open tracking sheet" style="display:flex;align-items:center;justify-content:center;text-decoration:none">＋</a>
  <a href="#week" data-tab="week" title="This week">📅</a>
  <a href="#deals/urgent" data-tab="urgent" title="Needs attention">❗</a>
</nav>

<div id="printview" aria-hidden="true"></div>
<div id="toast" role="status"></div>

<script>
(function () {
  'use strict';

  var CFG_KEY = 'mrfl_dash_cfg';
  var THEME_KEY = 'mrfl_dash_theme';
  var ENDPOINT = 'https://script.google.com/macros/s/AKfycbzheiPICRaOkutzU6kkrNS3n1pVebVVMtMwqAyQtDinMrzbqnaeTxFdHaqCeKtveKEzBw/exec';

  // Quick-link destinations shown on the home view (all open in a new tab).
  var INTAKE_URL = 'https://mrfltransactions.com/intake/intake-form.html';
  var SITE_URL   = 'https://mrfltransactions.com';
  var SHEET_URL  = 'https://docs.google.com/spreadsheets/d/1HmBdzF8KRWvRFa01-QqmRIi9cKHF7Bh1-pf9jeDQ_7Y';

  var DATA = null;        // last successful payload
  var selDay = 0;         // selected day offset in the week timeline
  var lastErr = null;     // state to show when data missing

  // ---------- theme ----------
  function currentTheme() {
    return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  }
  function applyTheme(t, persist) {
    document.documentElement.setAttribute('data-theme', t);
    var btn = document.getElementById('theme_btn');
    if (btn) btn.textContent = (t === 'dark') ? '☀️' : '🌙';
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', t === 'dark' ? '#0A0D18' : '#EDF0FA');
    if (persist) { try { localStorage.setItem(THEME_KEY, t); } catch (e) {} }
  }
  applyTheme(currentTheme(), false);
  document.getElementById('theme_btn').addEventListener('click', function () {
    applyTheme(currentTheme() === 'dark' ? 'light' : 'dark', true);
  });

  // ---------- helpers ----------
  var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  function parseLocal(iso) {
    var m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (!m) return null;
    return new Date(+m[1], +m[2] - 1, +m[3]);
  }
  function fmt(iso) { var d = parseLocal(iso); return d ? MONTHS[d.getMonth()] + ' ' + d.getDate() : ''; }
  function fmtY(iso) { var d = parseLocal(iso); return d ? MONTHS[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear() : ''; }
  function daysFromToday(iso) {
    var d = parseLocal(iso); if (!d) return null;
    var t = new Date(); t.setHours(0, 0, 0, 0);
    return Math.round((d - t) / 86400000);
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function inWords(n) {
    if (n === null || n === undefined) return '';
    if (n < 0) return Math.abs(n) + 'd overdue';
    if (n === 0) return 'today';
    if (n === 1) return 'tomorrow';
    return 'in ' + n + ' days';
  }
  function shortAddr(p) { return String(p || '').split(',')[0]; }

  var DONE = { closed: 1, cancelled: 1 };
  var STATUS_LABEL = { on_track: 'On track', active: 'Active', warning: 'Soon', urgent: 'Urgent',
    past_due: 'Past due', closed: 'Closed', cancelled: 'Cancelled', on_hold: 'On hold', unknown: 'Active' };
  var STATUS_CHIP = { on_track: 'green', active: 'green', warning: 'amber', urgent: 'red',
    past_due: 'red', closed: '', cancelled: 'red', on_hold: 'amber', unknown: 'green' };
  var STATUS_BAR = { past_due: 'var(--bar-red)', urgent: 'var(--bar-red)', warning: 'var(--bar-amber)',
    on_track: 'var(--bar-green)', active: 'var(--bar-green)', on_hold: 'var(--bar-amber)',
    closed: 'var(--bar-gray)', cancelled: 'var(--bar-gray)', unknown: 'var(--bar-green)' };
  var STATUS_RANK = { past_due: 0, urgent: 1, warning: 2, on_track: 3, active: 3, unknown: 3, on_hold: 4 };
  var SIDE_LABEL = { Seller: 'Listing', Buyer: 'Buyer', Both: 'Double sided' };

  function activeDeals() {
    return (DATA.deals || []).map(function (d, i) { d.__i = i; return d; })
      .filter(function (d) { return !DONE[d.status]; });
  }
  function pastDeals() {
    return (DATA.deals || []).map(function (d, i) { d.__i = i; return d; })
      .filter(function (d) { return !!DONE[d.status]; });
  }
  function sortByUrgency(arr) {
    return arr.slice().sort(function (a, b) {
      var r = (STATUS_RANK[a.status] || 3) - (STATUS_RANK[b.status] || 3);
      if (r !== 0) return r;
      return String(a.closing_date).localeCompare(String(b.closing_date));
    });
  }
  // every uncompleted milestone across active deals
  function upcomingMilestones() {
    var out = [];
    activeDeals().forEach(function (d) {
      (d.milestones || []).forEach(function (m) {
        if (m.completed || m.name === 'Effective Date') return;
        var n = daysFromToday(m.date);
        if (n === null) return;
        out.push({ days: n, name: m.name, date: m.date, deal: d });
      });
    });
    out.sort(function (a, b) { return a.days - b.days; });
    return out;
  }

  // ---------- shared renderers ----------
  function dealRow(d) {
    var chip = STATUS_CHIP[d.status] || '';
    var h = '<a class="row g tap" href="#deal/' + d.__i + '">';
    h += '<span class="ebar" style="background:' + STATUS_BAR[d.status] + '"></span>';
    h += '<span class="r-main">';
    h += '<span class="r-title">' + esc(d.property) + '</span>';
    h += '<span class="chips">';
    h += '<span class="chip purple">👤 ' + esc(d.agent) + '</span>';
    if (d.side) h += '<span class="chip blue">' + esc(SIDE_LABEL[d.side] || d.side) + '</span>';
    h += '<span class="chip ' + chip + '">' + esc(STATUS_LABEL[d.status] || d.status) + '</span>';
    h += '</span>';
    if (!DONE[d.status] && d.progress_total) {
      var pct = Math.max(3, Math.min(100, Math.round(100 * d.progress_elapsed / d.progress_total)));
      h += '<span class="mini-prog" style="display:block"><span style="display:block;width:' + pct + '%;height:100%"' +
        ' class="mp"></span></span>';
      h += '<span class="r-next" style="display:block">Day ' + d.progress_elapsed + ' of ' + d.progress_total +
        ' · closes ' + fmt(d.closing_date);
      if (d.next_deadline && d.next_deadline_date) {
        var od = d.days_until !== null && d.days_until < 0;
        h += ' · <b class="' + (od ? 'red' : (d.days_until !== null && d.days_until <= 3 ? 'amber' : '')) + '">' +
          esc(d.next_deadline) + ' ' + esc(inWords(d.days_until)) + '</b>';
      }
      h += '</span>';
    }
    h += '</span><span class="chev">›</span></a>';
    return h;
  }

  function backBtn(fallback) {
    return '<button class="hbtn" style="width:40px;height:40px" onclick="history.length>1?history.back():(location.hash=\'' + (fallback || '#home') + '\')" aria-label="Back">‹</button>';
  }

  // ---------- views ----------
  function viewHome() {
    var act = activeDeals();
    var urgent = act.filter(function (d) { return d.status === 'urgent' || d.status === 'past_due'; });
    var closing7 = act.filter(function (d) {
      var n = daysFromToday(d.closing_date);
      return n !== null && n >= 0 && n <= 7;
    });
    var agents = {};
    act.forEach(function (d) { agents[d.agent] = (agents[d.agent] || 0) + 1; });
    var up = upcomingMilestones();
    var attention = up.filter(function (u) { return u.days <= 3; });

    var h = '';
    h += '<div class="search g"><span class="mag">🔍</span>' +
      '<input id="q" type="search" placeholder="Search property, agent, milestone…" autocomplete="off"></div>' +
      '<div id="searchout"></div><div id="homebody">';

    h += '<div class="stats">';
    h += '<a class="stat g tap" href="#deals/all"><span class="ic blue">🏠</span><span><span class="num">' + act.length + '</span><br><span class="lbl">Active deals</span></span><span class="chev">›</span></a>';
    h += '<a class="stat g tap" href="#deals/urgent"><span class="ic red">❗</span><span><span class="num">' + urgent.length + '</span><br><span class="lbl">Urgent / past due</span></span><span class="chev">›</span></a>';
    h += '<a class="stat g tap" href="#deals/closing"><span class="ic amber">📆</span><span><span class="num">' + closing7.length + '</span><br><span class="lbl">Closing in 7 days</span></span><span class="chev">›</span></a>';
    h += '<a class="stat g tap" href="#agents"><span class="ic green">👥</span><span><span class="num">' + Object.keys(agents).length + '</span><br><span class="lbl">Agents active</span></span><span class="chev">›</span></a>';
    h += '</div>';

    // 🎁 referrals row
    var refs = DATA.referrals || [];
    var rewardDue = refs.filter(function (r) { return String(r.status).toLowerCase().indexOf('reward due') >= 0; }).length;
    h += '<a class="row g tap" href="#referrals" style="margin-top:12px">' +
      '<span class="ebar" style="background:' + (rewardDue ? 'var(--bar-amber)' : 'var(--bar-blue)') + '"></span>' +
      '<span class="r-main"><span class="r-title">🎁 Referrals · ' + refs.length + ' logged</span>' +
      '<span class="r-sub">' + (rewardDue
        ? rewardDue + ' reward' + (rewardDue > 1 ? 's' : '') + ' due — time to say thank you!'
        : (refs.length ? 'All caught up on rewards' : 'Agents share invites from their portal — log referrals in 🛠 TC Tools')) +
      '</span></span><span class="chev">›</span></a>';

    // ⭐ reviews row — only when something is waiting for approval
    var revStats = DATA.reviews || {};
    if (revStats.pending > 0) {
      h += '<div class="row g" style="margin-top:10px">' +
        '<span class="ebar" style="background:var(--bar-amber)"></span>' +
        '<span class="r-main"><span class="r-title">⭐ ' + revStats.pending + ' review' + (revStats.pending > 1 ? 's' : '') + ' waiting for approval</span>' +
        '<span class="r-sub">Approve in the sheet: 🛠 TC Tools → ⭐ Manage reviews' +
        (revStats.shown ? ' · ' + revStats.shown + ' live on the site' : '') + '</span></span></div>';
    }

    // week pills + timeline
    h += '<div class="sec" id="weeksec"><h2>This week</h2><span class="more">deadlines by day</span></div>';
    h += '<div class="days" id="days">';
    var today = new Date(); today.setHours(0, 0, 0, 0);
    for (var i = 0; i < 7; i++) {
      var d = new Date(today); d.setDate(d.getDate() + i);
      var has = up.some(function (u) { return u.days === i; });
      h += '<div class="day' + (i === selDay ? ' on' : '') + '" data-day="' + i + '">' +
        '<div class="dw">' + DAYS[d.getDay()] + '</div><div class="dn">' + d.getDate() + '</div>' +
        '<div class="dot' + (has ? '' : ' off') + '"></div></div>';
    }
    h += '</div><div class="tl" id="daylist"></div>';

    // needs attention preview
    h += '<div class="sec"><h2>Needs attention</h2><a class="more" href="#deals/urgent">See all ›</a></div>';
    if (attention.length === 0) {
      h += '<div class="tl-empty">✅ Nothing overdue or due in the next 3 days.</div>';
    } else {
      attention.slice(0, 3).forEach(function (u) {
        h += tlItem(u);
      });
    }

    // quick links — everything Gloria reaches from the dashboard
    h += '<div class="sec"><h2>Quick links</h2><span class="more">open in a new tab ↗</span></div>';
    h += '<a class="row g tap" href="' + INTAKE_URL + '" target="_blank" rel="noopener">' +
      '<span class="ebar" style="background:var(--bar-blue)"></span>' +
      '<span class="r-main"><span class="r-title">📝 New intake form</span>' +
      '<span class="r-sub">Upload a contract & start a transaction</span></span><span class="chev">↗</span></a>';
    h += '<a class="row g tap" href="' + SITE_URL + '" target="_blank" rel="noopener" style="margin-top:10px">' +
      '<span class="ebar" style="background:var(--bar-green)"></span>' +
      '<span class="r-main"><span class="r-title">🌐 My website</span>' +
      '<span class="r-sub">mrfltransactions.com — what agents & clients see</span></span><span class="chev">↗</span></a>';
    h += '<a class="row g tap" href="' + SHEET_URL + '" target="_blank" rel="noopener" style="margin-top:10px">' +
      '<span class="ebar" style="background:var(--bar-amber)"></span>' +
      '<span class="r-main"><span class="r-title">📊 Tracking sheet</span>' +
      '<span class="r-sub">The master Google Sheet — all tabs & dashboard</span></span><span class="chev">↗</span></a>';

    h += '</div>';  // homebody

    var t = new Date();
    h += '<div class="updated">Updated ' + t.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) + ' — live from your tracking sheet</div>';
    setMain(h);
    renderDayList();

    // search wiring
    var q = document.getElementById('q');
    q.addEventListener('input', function () {
      var v = q.value.trim().toLowerCase();
      var out = document.getElementById('searchout');
      var body = document.getElementById('homebody');
      if (!v) { out.innerHTML = ''; body.style.display = ''; return; }
      body.style.display = 'none';
      var hits = (DATA.deals || []).map(function (d, i) { d.__i = i; return d; }).filter(function (d) {
        if (String(d.property).toLowerCase().indexOf(v) >= 0) return true;
        if (String(d.agent).toLowerCase().indexOf(v) >= 0) return true;
        return (d.milestones || []).some(function (m) { return String(m.name).toLowerCase().indexOf(v) >= 0; });
      });
      var hh = '<div class="sec"><h2>Results</h2><span class="more">' + hits.length + ' found</span></div>';
      if (!hits.length) hh += '<div class="tl-empty">No matches for “' + esc(q.value.trim()) + '”.</div>';
      hits.forEach(function (d) { hh += dealRow(d); });
      out.innerHTML = hh;
    });
  }

  function tlItem(u) {
    var red = u.days < 0;
    var isClose = u.name === 'Closing Date';
    var bar = red ? 'var(--bar-red)' : (isClose ? 'var(--bar-green)' : (u.days <= 3 ? 'var(--bar-amber)' : 'var(--bar-blue)'));
    return '<a class="tl-item g tap" href="#deal/' + u.deal.__i + '">' +
      '<span class="ebar" style="background:' + bar + '"></span>' +
      '<span class="t-main"><span class="t-what">' + esc(u.name) + ' · ' + esc(inWords(u.days)) + '</span>' +
      '<span class="t-sub" style="display:block">' + esc(shortAddr(u.deal.property)) + ' · ' + esc(u.deal.agent) + ' · ' + fmt(u.date) + '</span></span>' +
      '<span class="chev">›</span></a>';
  }

  function renderDayList() {
    var list = document.getElementById('daylist');
    if (!list) return;
    var up = upcomingMilestones().filter(function (u) { return u.days === selDay; });
    var h = '';
    if (!up.length) {
      var d = new Date(); d.setDate(d.getDate() + selDay);
      h = '<div class="tl-empty">No deadlines on ' + DAYS[d.getDay()] + ' ' + MONTHS[d.getMonth()] + ' ' + d.getDate() + '.</div>';
    } else {
      up.forEach(function (u) { h += tlItem(u); });
    }
    list.innerHTML = h;
    document.querySelectorAll('.day').forEach(function (el) {
      el.classList.toggle('on', +el.getAttribute('data-day') === selDay);
    });
  }

  function viewDeals(filter, agentName) {
    var act = sortByUrgency(activeDeals());
    var list, title, sub;
    if (filter === 'urgent') {
      list = act.filter(function (d) { return d.status === 'urgent' || d.status === 'past_due'; });
      title = 'Needs attention'; sub = 'urgent & past due';
    } else if (filter === 'closing') {
      list = act.filter(function (d) {
        var n = daysFromToday(d.closing_date);
        return n !== null && n >= 0 && n <= 7;
      }).sort(function (a, b) { return String(a.closing_date).localeCompare(String(b.closing_date)); });
      title = 'Closing soon'; sub = 'within 7 days';
    } else if (filter === 'agent') {
      list = act.filter(function (d) {
        return agentRefs(d.agent).some(function (r) { return r.toLowerCase() === String(agentName).toLowerCase(); });
      });
      title = agentName; sub = list.length + ' active deal' + (list.length === 1 ? '' : 's');
    } else {
      list = act; title = 'All transactions'; sub = list.length + ' active';
    }

    var h = '<div class="dt-head">' + backBtn('#home') + '<h1>' + esc(title) +
      ' <span style="font-size:12px;color:var(--muted);font-weight:700">· ' + esc(sub) + '</span></h1></div>';
    if (!list.length) h += '<div class="tl-empty">Nothing here right now. 🌴</div>';
    list.forEach(function (d) { h += dealRow(d); });

    if (filter === 'all') {
      var past = pastDeals();
      if (past.length) {
        h += '<div class="sec"><h2>Closed & cancelled</h2><span class="more">' + past.length + '</span></div>';
        past.forEach(function (d) { h += dealRow(d); });
      }
    }
    setMain(h);
  }

  // A shared deal's agent prefix is "Tiffany+Carlitos" — split it so the
  // deal is listed under each agent (matches the webhook's _agentRefSplit).
  function agentRefs(agent) {
    return String(agent || '').split(/\s*[+&]\s*/)
      .map(function (s) { return s.trim(); })
      .filter(function (s) { return s; });
  }

  function viewAgents() {
    var act = activeDeals();
    var byAgent = {};
    act.forEach(function (d) {
      agentRefs(d.agent).forEach(function (n) {
        if (!byAgent[n]) byAgent[n] = [];
        byAgent[n].push(d);
      });
    });
    var names = Object.keys(byAgent).sort();
    var h = '<div class="dt-head">' + backBtn('#home') + '<h1>Agents <span style="font-size:12px;color:var(--muted);font-weight:700">· ' + names.length + ' active</span></h1></div>';
    if (!names.length) h += '<div class="tl-empty">No active transactions right now.</div>';
    names.forEach(function (n) {
      var deals = sortByUrgency(byAgent[n]);
      var next = null;
      deals.forEach(function (d) {
        if (d.days_until === null || !d.next_deadline) return;
        if (next === null || d.days_until < next.days) next = { days: d.days_until, name: d.next_deadline, prop: d.property };
      });
      h += '<a class="row g tap" href="#deals/agent/' + encodeURIComponent(n) + '">' +
        '<span class="agent-av">' + esc(n.charAt(0).toUpperCase()) + '</span>' +
        '<span class="r-main"><span class="r-title">' + esc(n) + '</span>' +
        '<span class="r-sub">' + deals.length + ' active deal' + (deals.length === 1 ? '' : 's') +
        (next ? ' · next: ' + esc(next.name) + ' ' + esc(inWords(next.days)) : '') + '</span></span>' +
        '<button type="button" class="linkbtn" data-linkref="' + esc(n) + '" title="Send ' + esc(n) + ' their portal link">🔗</button>' +
        '<span class="chev">›</span></a>';
    });
    setMain(h);
  }

  function viewReferrals() {
    var refs = DATA.referrals || [];
    var rewardDue = refs.filter(function (r) { return String(r.status).toLowerCase().indexOf('reward due') >= 0; });
    var h = '<div class="dt-head">' + backBtn('#home') + '<h1>🎁 Referrals <span style="font-size:12px;color:var(--muted);font-weight:700">· ' +
      refs.length + ' logged' + (rewardDue.length ? ' · ' + rewardDue.length + ' reward' + (rewardDue.length > 1 ? 's' : '') + ' due' : '') + '</span></h1></div>';

    if (!refs.length) {
      h += '<div class="tl-empty">No referrals logged yet.<br>Log one in the sheet: 🛠 TC Tools → 🎁 Log a referral.<br>' +
        'Agents share their invite link from the portal\'s 🎁 card.</div>';
      setMain(h);
      return;
    }
    refs.slice().reverse().forEach(function (r) {
      var s = String(r.status).toLowerCase();
      var chip = s.indexOf('reward due') >= 0 ? '<span class="chip amber">🎁 Reward due</span>'
        : s.indexOf('redeemed') >= 0 ? '<span class="chip">Reward redeemed</span>'
        : s.indexOf('joined') >= 0 ? '<span class="chip green">Joined</span>'
        : '<span class="chip blue">Invited</span>';
      var bar = s.indexOf('reward due') >= 0 ? 'var(--bar-amber)'
        : s.indexOf('joined') >= 0 ? 'var(--bar-green)'
        : s.indexOf('redeemed') >= 0 ? 'var(--bar-gray)' : 'var(--bar-blue)';
      h += '<div class="row g"><span class="ebar" style="background:' + bar + '"></span>' +
        '<span class="r-main"><span class="r-title">' + esc(r.new_agent || '(no name)') + '</span>' +
        '<span class="r-sub">referred by ' + esc(r.referred_by || '—') +
        (r.date ? ' · ' + esc(r.date) : '') + (r.contact ? ' · ' + esc(r.contact) : '') + '</span>' +
        '<span class="chips">' + chip + '</span>' +
        (r.notes ? '<span class="r-sub" style="display:block;margin-top:5px">📝 ' + esc(r.notes) + '</span>' : '') +
        '</span></div>';
    });
    h += '<div class="tl-empty" style="margin-top:8px">Update statuses in the sheet\'s 🎁 Referrals tab — this list follows it live.</div>';
    setMain(h);
  }

  function viewDetail(idx) {
    var d = (DATA.deals || [])[idx];
    if (!d) { location.hash = '#home'; return; }
    d.__i = idx;
    var isDone = !!DONE[d.status];
    var chip = STATUS_CHIP[d.status] || '';

    var h = '<div class="dt-head">' + backBtn('#deals/all') + '<h1>' + esc(d.property) + '</h1></div>';
    h += '<div class="chips" style="margin:-6px 2px 14px">' +
      '<span class="chip purple">👤 ' + esc(d.agent) + '</span>' +
      (d.side ? '<span class="chip blue">' + esc(SIDE_LABEL[d.side] || d.side) + ' side</span>' : '') +
      '<span class="chip ' + chip + '">' + esc(STATUS_LABEL[d.status] || d.status) + '</span></div>';

    h += '<a class="cta-btn" href="' + esc(d.sheet_link || '#') + '" target="_blank" rel="noopener">Open sheet tab ↗</a>';
    h += '<button type="button" class="cta-btn ghost" data-print="' + idx + '">🖨 Print / save as PDF</button>';

    if (!isDone && d.next_deadline && d.next_deadline_date) {
      var od = d.days_until !== null && d.days_until < 0;
      h += '<div class="callout2' + (od ? ' red' : '') + '">⏰ Next: ' + esc(d.next_deadline) + ' — ' +
        fmtY(d.next_deadline_date) + ' (' + esc(inWords(d.days_until)) + ')</div>';
    }

    if (!isDone && d.progress_total) {
      var pct = Math.max(3, Math.min(100, Math.round(100 * d.progress_elapsed / d.progress_total)));
      h += '<div class="panel g"><h3>Progress</h3>' +
        '<div class="mini-prog"><div style="width:' + pct + '%;height:100%" class="mp"></div></div>' +
        '<div class="r-next">Day ' + d.progress_elapsed + ' of ' + d.progress_total +
        ' · ' + fmt(d.effective_date) + ' → closing ' + fmtY(d.closing_date) + '</div></div>';
    }

    if (d.milestones && d.milestones.length) {
      h += '<div class="panel g"><h3>Milestones · ' + d.done_count + '/' + d.total_count + ' done</h3>';
      d.milestones.forEach(function (m) {
        var cls = 'future';
        if (m.completed) cls = 'on';
        else if (!isDone) {
          var n = daysFromToday(m.date);
          if (n !== null && n < 0) cls = 'late';
          else if (n !== null && n <= 7) cls = 'soon';
        }
        h += '<div class="mrow2 ' + cls + '"><span class="mk">' +
          (m.completed ? '✓' : (cls === 'late' ? '!' : (cls === 'soon' ? '●' : '○'))) + '</span>' +
          '<span class="mn">' + esc(m.name) + '</span><span class="md">' + fmt(m.date) + '</span></div>';
      });
      h += '</div>';
    }

    (d.details || []).forEach(function (sec) {
      h += '<div class="panel g"><h3>' + esc(sec.title) + '</h3>';
      (sec.items || []).forEach(function (it) {
        h += '<div class="kv">' + (it.label ? '<span class="k">' + esc(it.label) + '</span>' : '') +
          '<span class="v">' + contactValue(it.label, it.value) + '</span></div>';
      });
      h += '</div>';
    });

    setMain(h);
  }

  function contactValue(label, value) {
    var l = String(label || '').toLowerCase();
    var v = String(value || '');
    if (/email/.test(l) && v.indexOf('@') > 0) return '<a href="mailto:' + esc(v) + '">' + esc(v) + '</a>';
    if (/phone|mobile/.test(l)) {
      var digits = v.replace(/[^\d+]/g, '');
      if (digits.length >= 10) return '<a href="tel:' + esc(digits) + '">' + esc(v) + '</a>';
    }
    return esc(v);
  }

  // ---------- per-transaction print view ----------
  function buildPrintHtml(d) {
    var now = new Date();
    var status = STATUS_LABEL[d.status] || d.status;
    var side = d.side ? (SIDE_LABEL[d.side] || d.side) : '';
    var h = '<div class="p-doc">';
    h += '<div class="p-head"><span class="p-brand">MRFL <b>TRANSACTIONS</b></span>' +
      '<span class="p-kind">Transaction Overview</span></div>';
    h += '<h1>' + esc(d.property) + '</h1>';
    h += '<div class="p-meta">Agent: ' + esc(d.agent || '') + (side ? ' · ' + esc(side) + ' side' : '') +
      ' · Status: ' + esc(status) + '</div>';

    h += '<table><tr><th>Effective date</th><th>Closing date</th><th>Progress</th><th>Next deadline</th></tr><tr>';
    h += '<td>' + fmtY(d.effective_date) + '</td><td>' + fmtY(d.closing_date) + '</td>';
    h += '<td>' + (d.progress_total ? 'Day ' + d.progress_elapsed + ' of ' + d.progress_total : '—') + '</td>';
    h += '<td>' + (d.next_deadline ? esc(d.next_deadline) + ' — ' + fmtY(d.next_deadline_date) +
      (d.days_until !== null && d.days_until !== undefined ? ' (' + esc(inWords(d.days_until)) + ')' : '') : '—') + '</td>';
    h += '</tr></table>';

    if (d.milestones && d.milestones.length) {
      h += '<div class="p-sec"><h2>Milestones</h2><table><tr><th>Milestone</th><th>Date</th><th>Status</th></tr>';
      d.milestones.forEach(function (m) {
        var st = m.completed ? '✓ Completed'
          : (function () { var n = daysFromToday(m.date); return (n !== null && n < 0) ? '⚠ Past due' : '◻ Upcoming'; })();
        h += '<tr><td>' + esc(m.name) + '</td><td>' + fmtY(m.date) + '</td><td>' + st + '</td></tr>';
      });
      h += '</table></div>';
    }

    (d.details || []).forEach(function (sec) {
      h += '<div class="p-sec"><h2>' + esc(sec.title) + '</h2>';
      (sec.items || []).forEach(function (it) {
        h += '<div class="p-kv">' + (it.label ? '<span class="k">' + esc(it.label) + '</span>' : '') +
          '<span class="v">' + esc(it.value) + '</span></div>';
      });
      h += '</div>';
    });

    h += '<div class="p-foot">Prepared by Gloria Grullon · MRFL Transactions · (401) 282-8414 · MRFLTransactions@gmail.com<br>' +
      'Generated ' + now.toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' }) + ' at ' +
      now.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) + ' — live from the MRFL tracking sheet</div>';
    h += '</div>';
    return h;
  }

  document.addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('[data-print]') : null;
    if (!btn || !DATA) return;
    var d = (DATA.deals || [])[+btn.getAttribute('data-print')];
    if (!d) return;
    document.getElementById('printview').innerHTML = buildPrintHtml(d);
    window.print();
  });

  // ---------- send an agent their portal link (🔗 on agent rows) ----------
  var toastTimer = null;
  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.style.display = 'block';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.style.display = 'none'; }, 3500);
  }
  function legacyCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;left:-9999px;top:0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (err) {}
    ta.remove();
  }
  function shareAgentLink(ref) {
    var link = DATA && DATA.portal_links && DATA.portal_links[ref];
    if (!link) {
      toast('No link yet — paste the latest Code.gs (v7.6) and deploy a New version, then refresh ↻');
      return;
    }
    var msg = 'Hi ' + ref + '! 🏡 I set up a private portal for your transactions with me. ' +
      'Your personal link shows your deals live — timelines, deadlines, and every contact on the file:\n\n' +
      link + '\n\n' +
      'On your phone: open it, then Share → Add to Home Screen, and it works like an app. ' +
      'It updates automatically whenever anything changes. This link is just for you — please don’t forward it.\n\n' +
      '— Gloria · MRFL Transactions';
    if (navigator.share) {
      navigator.share({ text: msg }).catch(function () { /* cancelled — fine */ });
      return;
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(msg).then(function () {
        toast('✓ Invite for ' + ref + ' copied — paste it into a text or email');
      }).catch(function () { legacyCopy(msg); toast('✓ Invite for ' + ref + ' copied — paste it into a text or email'); });
    } else {
      legacyCopy(msg);
      toast('✓ Invite for ' + ref + ' copied — paste it into a text or email');
    }
  }
  document.addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('[data-linkref]') : null;
    if (!btn) return;
    e.preventDefault();
    e.stopPropagation();
    shareAgentLink(btn.getAttribute('data-linkref'));
  }, true);

  // ---------- shell ----------
  function setMain(html) {
    document.getElementById('main').innerHTML = html;
    window.scrollTo(0, 0);
  }
  function showState(icon, title, body) {
    setMain('<div class="state"><div class="big">' + icon + '</div><h2>' + esc(title) + '</h2><p>' + body + '</p></div>');
  }

  function route() {
    var hash = location.hash || '#home';
    // nav highlighting
    document.querySelectorAll('.bnav a[data-tab]').forEach(function (a) {
      var t = a.getAttribute('data-tab');
      var on = (t === 'home' && (hash === '#home' || hash === '' || hash === '#')) ||
        (t === 'agents' && hash === '#agents') ||
        (t === 'urgent' && hash === '#deals/urgent') ||
        (t === 'week' && hash === '#week');
      a.classList.toggle('on', on);
    });
    if (!DATA) { if (lastErr) lastErr(); return; }

    if (hash === '#week') {
      // week tab = home scrolled to the week section
      viewHome();
      var el = document.getElementById('weeksec');
      if (el) el.scrollIntoView({ block: 'start' });
      return;
    }
    var m;
    if (hash === '' || hash === '#' || hash === '#home') return viewHome();
    if (hash === '#agents') return viewAgents();
    if (hash === '#referrals') return viewReferrals();
    if ((m = hash.match(/^#deal\/(\d+)$/))) return viewDetail(+m[1]);
    if ((m = hash.match(/^#deals\/agent\/(.+)$/))) return viewDeals('agent', decodeURIComponent(m[1]));
    if ((m = hash.match(/^#deals\/(all|urgent|closing)$/))) return viewDeals(m[1]);
    return viewHome();
  }
  window.addEventListener('hashchange', route);

  // day-pill delegation
  document.addEventListener('click', function (e) {
    var day = e.target.closest ? e.target.closest('.day') : null;
    if (day && day.hasAttribute('data-day')) {
      selDay = +day.getAttribute('data-day');
      renderDayList();
    }
  });

  // greeting
  (function () {
    var hNow = new Date().getHours();
    document.getElementById('gd').textContent =
      (hNow < 12 ? 'Good morning' : hNow < 17 ? 'Good afternoon' : 'Good evening') + ' 👋';
  })();

  // ---------- data ----------
  function readKey() {
    var k = new URLSearchParams(location.search).get('k') || '';
    if (k) { try { localStorage.setItem(CFG_KEY, k); } catch (e) {} return k; }
    try { return localStorage.getItem(CFG_KEY) || ''; } catch (e) { return ''; }
  }
  var key = readKey();
  var loading = false;

  function load() {
    if (loading) return;
    if (!key) {
      lastErr = function () { showState('🔒', 'This dashboard needs your private link',
        'Open it using your personal link — in the sheet: 🛠 TC Tools → 🖥 My dashboard link.'); };
      lastErr();
      return;
    }
    loading = true;
    fetch(ENDPOINT + '?view=operator&key=' + encodeURIComponent(key), { method: 'GET', cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        loading = false;
        if (!data.success) {
          if (data.status === 'ok' || data.generated_at) {
            lastErr = function () { showState('🛠', 'Almost ready',
              'The dashboard endpoint isn’t deployed yet. In Apps Script: Deploy → Manage deployments → update to a New version.'); };
          } else {
            lastErr = function () { showState('🔒', 'Link not valid',
              esc(data.error || 'Get a fresh link: 🛠 TC Tools → 🖥 My dashboard link.')); };
          }
          lastErr();
          return;
        }
        DATA = data;
        lastErr = null;
        route();
      })
      .catch(function () {
        loading = false;
        if (DATA) return;  // keep showing the data we already have
        lastErr = function () { showState('📶', 'Couldn’t load right now',
          'Check your internet connection and tap ↻ to retry.'); };
        lastErr();
      });
  }

  document.getElementById('refresh').addEventListener('click', function () {
    setMain('<div class="state"><div class="spinner"></div><p>Refreshing…</p></div>');
    DATA = null;
    load();
  });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && !loading) load();
  });

  load();
})();
</script>
</body>
</html>
